apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyc-api
  namespace: kyc-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kyc-api
  template:
    metadata:
      labels:
        app: kyc-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/replace-with-owner/kyc-api:replace-with-tag
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
